[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsge-llm"
version = "0.1.0"
description = "DSGE vs LLM Agents — Macroeconomic simulation for Argentina"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "linearsolve>=3.6",
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "autogen-agentchat>=0.4",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
